{% extends "base.html" %}
{% block title %}Add Subject — Academic Performance Analyzer{% endblock %}

{% block content %}
<div class="page-header">
  <h4><i class="fas fa-book-open me-2 text-primary-custom"></i>Add New Subject</h4>
  <a href="/subjects" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="form-card">
      <div id="form-alert"></div>
      <form id="subject-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Subject Code <span class="text-danger">*</span></label>
            <input type="text" id="subject_code" class="form-control" placeholder="e.g. CS301" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Subject Name <span class="text-danger">*</span></label>
            <input type="text" id="subject_name" class="form-control" placeholder="e.g. Data Structures" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Department <span class="text-danger">*</span></label>
            <select id="department" class="form-select" required>
              <option value="">Select Department</option>
              <option>Computer Science</option><option>Electronics</option>
              <option>Mechanical</option><option>Civil</option><option>Mathematics</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Max Marks</label>
            <input type="number" id="max_marks" class="form-control" value="100" min="1">
          </div>
          <div class="col-md-3">
            <label class="form-label">Min Marks</label>
            <input type="number" id="min_marks" class="form-control" value="0" min="0">
          </div>
        </div>
        <hr class="divider">
        <div class="d-flex gap-2 justify-content-end">
          <a href="/subjects" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Add Subject</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('subject-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const payload = {
    subject_code: document.getElementById('subject_code').value.trim(),
    subject_name: document.getElementById('subject_name').value.trim(),
    department: document.getElementById('department').value,
    max_marks: parseFloat(document.getElementById('max_marks').value) || 100,
    min_marks: parseFloat(document.getElementById('min_marks').value) || 0,
  };
  if (!payload.subject_code || !payload.subject_name || !payload.department) {
    document.getElementById('form-alert').innerHTML = '<div class="alert alert-danger">Fill all required fields.</div>'; return;
  }
  try {
    showLoading();
    await apiFetch('/api/subjects/', {method:'POST', body: JSON.stringify(payload)});
    hideLoading(); showMessage('Subject added!','success');
    setTimeout(() => window.location.href = '/subjects', 1000);
  } catch(err) {
    hideLoading();
    document.getElementById('form-alert').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
});
</script>
{% endblock %}
