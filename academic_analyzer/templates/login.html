<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Academic Performance Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d47a1 0%, #1a73e8 50%, #42a5f5 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 440px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-header { background: linear-gradient(135deg, #0d47a1, #1a73e8); padding: 2rem; text-align: center; }
        .login-body { padding: 2rem 2.5rem; background: #fff; }
        .login-footer { background: #f8f9fa; padding: 1rem 2rem; border-top: 1px solid #e9ecef; }
        .form-control:focus { border-color: #1a73e8; box-shadow: 0 0 0 0.2rem rgba(26,115,232,0.25); }
        .btn-login { background: linear-gradient(135deg, #1a73e8, #0d47a1); border: none; padding: 0.75rem; font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; border-radius: 8px; }
        .btn-login:hover { background: linear-gradient(135deg, #0d47a1, #1a73e8); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(26,115,232,0.4); }
        .input-group-text { background: #f8f9fa; border-right: none; }
        .form-control { border-left: none; }
        .input-group .form-control:focus { border-color: #1a73e8; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-graduation-cap text-white" style="font-size:3rem;"></i>
            <h3 class="text-white mt-2 mb-1 fw-bold">Academic Performance Analyzer</h3>
        </div>
        <div class="login-body">
            <h5 class="fw-bold text-dark mb-1">Sign In</h5>
            <p class="text-muted small mb-4">Enter your credentials to access the system</p>

            <div id="loginError" class="alert alert-danger d-none" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="loginErrorMsg">Invalid credentials. Please try again.</span>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter password" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-white" id="loginBtn">
                    <span id="loginBtnText"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                    <span id="loginBtnSpinner" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
                    </span>
                </button>
            </form>
        </div>
        <div class="login-footer text-center">
            <small class="text-muted">
                <i class="fas fa-shield-alt me-1 text-primary"></i>
                Secure academic data management system
            </small>
            <br>
            
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard';
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const btnText = document.getElementById('loginBtnText');
            const btnSpinner = document.getElementById('loginBtnSpinner');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorDiv.classList.remove('d-none');
                document.getElementById('loginErrorMsg').textContent = 'Please enter username and password.';
                return;
            }

            errorDiv.classList.add('d-none');
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            btn.disabled = true;

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    // Fetch user info
                    const userResp = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + data.access_token }
                    });
                    if (userResp.ok) {
                        const user = await userResp.json();
                        localStorage.setItem('user', JSON.stringify(user));
                    }
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.classList.remove('d-none');
                    document.getElementById('loginErrorMsg').textContent = data.detail || 'Invalid username or password.';
                }
            } catch (err) {
                errorDiv.classList.remove('d-none');
                document.getElementById('loginErrorMsg').textContent = 'Connection error. Please try again.';
            } finally {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
