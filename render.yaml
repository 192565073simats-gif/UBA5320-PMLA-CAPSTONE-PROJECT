services:
  - type: web
    name: academic-analyzer
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn academic_analyzer.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: academic-analyzer-db
          property: connectionString

databases:
  - name: academic-analyzer-db
    databaseName: academic_analyzer
    user: academic_analyzer
    plan: free
    region: oregon
